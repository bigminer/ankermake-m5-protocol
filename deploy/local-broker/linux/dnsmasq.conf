# Shared M5C DHCP/DNS settings. mode.conf controls local vs cloud routing.
interface=@AP_INTERFACE@
bind-interfaces
listen-address=@AP_ADDRESS@
user=dnsmasq
group=dnsmasq
port=53
no-resolv
no-hosts
domain-needed
bogus-priv
dhcp-authoritative
dhcp-range=@DHCP_START@,@DHCP_END@,255.255.255.0,12h
dhcp-hostsdir=/etc/m5c-local/dhcp-hosts.d
dhcp-option=option:dns-server,@AP_ADDRESS@
dhcp-option=option:ntp-server,@AP_ADDRESS@
dhcp-leasefile=/var/lib/m5c-local/dnsmasq.leases
log-dhcp
log-queries
log-facility=-

# The printer's observed NTP names resolve to the local chrony service.
address=/pool.ntp.org/@AP_ADDRESS@
address=/time.nist.gov/@AP_ADDRESS@
address=/time4.google.com/@AP_ADDRESS@
address=/time.apple.com/@AP_ADDRESS@
address=/time.windows.com/@AP_ADDRESS@

# The mode file either redirects/blocks Anker (local mode), or forwards DNS
# and supplies a gateway (cloud mode).
conf-file=/etc/m5c-local/mode.conf
